name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e ".[dev,web]"

      - name: Run tests with warning and coverage gates
        run: python -m pytest -W error::ResourceWarning --cov=finance_tracker --cov-report=term-missing --cov-fail-under=90

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy

      - name: Build and inspect package
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          finance-tracker --help

      - name: Audit Python dependencies
        run: python -m pip_audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Set up Python for OpenAPI generation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install API package
        run: python -m pip install -e ".[web]"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage gate
        run: npm run test:coverage

      - name: Run frontend linters and formatting check
        run: |
          npm run lint
          npm run format:check

      - name: Check generated API and packaged SPA assets
        run: npm run check:generated

      - name: Build wheel from the generated SPA
        run: |
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          finance-tracker --help

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright responsive tests
        run: npm run test:e2e

      - name: Run packaged full-stack Playwright tests
        run: npm run test:e2e:fullstack
