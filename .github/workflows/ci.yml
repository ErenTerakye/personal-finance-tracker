name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e ".[dev,web]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check .
