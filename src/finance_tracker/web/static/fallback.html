<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Workbench | Personal Finance Tracker</title>
    <style>
      body {
        min-block-size: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        color: #151923;
        background: #f5f7f4;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-inline-size: 38rem;
        padding: 2rem;
        border: 1px solid #cdd8d1;
        border-radius: 7px;
        background: #ffffff;
      }

      code {
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ledger Workbench is ready for its frontend build.</h1>
      <p>Run <code>npm install</code> and <code>npm run build</code> from the repository root, then start <code>finance-tracker web</code> again.</p>
    </main>
  </body>
</html>
