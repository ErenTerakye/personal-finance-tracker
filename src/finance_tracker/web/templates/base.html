<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        <span>Finance Tracker</span>
      </a>
      <nav class="nav">
        <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="/?month={{ selected_month }}&year={{ selected_year }}">Dashboard</a>
        <a class="{{ 'active' if active_page == 'transactions' else '' }}" href="/transactions?month={{ selected_month }}&year={{ selected_year }}">Transactions</a>
        <a class="{{ 'active' if active_page == 'budgets' else '' }}" href="/budgets?month={{ selected_month }}&year={{ selected_year }}">Budgets</a>
      </nav>
    </header>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/app.js') }}"></script>
  </body>
</html>
