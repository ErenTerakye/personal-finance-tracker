[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-tracker"
version = "1.1.0"
description = "A local-first finance tracker with Typer CLI, FastAPI API, React UI, SQLite, CSV workflows, reports, and charts."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eren Terakye" }]
keywords = ["finance", "cli", "fastapi", "react", "sqlite", "csv", "budgeting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "httpx2>=2.5.0",
    "mypy>=1.16",
    "pip-audit>=2.9",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.5",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
finance-tracker = "finance_tracker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_tracker = [
    "web/static/**/*.html",
    "web/static/**/*.css",
    "web/static/**/*.js",
    "web/static/**/*.json",
    "web/static/**/*.svg",
    "web/static/**/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
packages = ["finance_tracker"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
